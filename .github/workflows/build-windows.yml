name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Reuse the compiled zip from this earlier run id (skips compilation)"
        required: false
        default: ""
      version:
        description: "Release tag, for example v0.1.0 (empty uses the run number). Stamped into the browser when it is compiled, so a run that reuses build_run_id keeps the version of that earlier build"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.build_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Android", "C:\Program Files\dotnet", "C:\hostedtoolcache\windows\Java*" -ErrorAction SilentlyContinue

      - name: Stamp the version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if (-not $version) { Write-Host "No version input, the source keeps its own version."; exit 0 }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Version '$env:RELEASE_VERSION' is not like v1.2.3" }
          $file = "browser/base/content/komorebi/komorebi-update.js"
          $source = [IO.File]::ReadAllText("$PWD/$file")
          $stamped = [regex]::Replace($source, 'const KOMOREBI_VERSION = "[^"]*";', "const KOMOREBI_VERSION = `"$version`";")
          if ($stamped -eq $source -and $source -notmatch "const KOMOREBI_VERSION = `"$([regex]::Escape($version))`";") { throw "KOMOREBI_VERSION was not found in $file" }
          [IO.File]::WriteAllText("$PWD/$file", $stamped)
          Select-String -Path $file -Pattern 'const KOMOREBI_VERSION'

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $env:RUNNER_TEMP\mb.exe
          Start-Process $env:RUNNER_TEMP\mb.exe -ArgumentList '/S' -Wait

      - name: Write mozconfig and build script
        shell: pwsh
        run: |
          @'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-tests
          ac_add_options --disable-crashreporter
          ac_add_options --disable-updater
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-bits-download
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --with-branding=browser/branding/komorebi
          ac_add_options --with-app-name=komorebi
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-komorebi
          '@ | Set-Content -Encoding ascii .mozconfig
          @'
          set -ex
          cd "$GITHUB_WORKSPACE_MSYS"
          export MOZCONFIG="$PWD/.mozconfig"
          ./mach --no-interactive bootstrap --application-choice=browser
          ./mach build
          ./mach package
          '@ | Set-Content -Encoding ascii build.sh

      - name: Bootstrap, build and package
        shell: pwsh
        run: |
          $ws = ($env:GITHUB_WORKSPACE -replace '\\','/') -replace '^([A-Za-z]):','/$1'
          $ws = $ws.Substring(0,2).ToLower() + $ws.Substring(2)
          $env:MSYSTEM = 'MINGW64'
          $env:MOZILLABUILD = 'C:\mozilla-build'
          $env:MSYS2_PATH_TYPE = 'inherit'
          $env:GITHUB_WORKSPACE_MSYS = $ws
          & C:\mozilla-build\msys2\usr\bin\bash.exe -lc "cd '$ws' && bash ./build.sh"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect zip
        shell: pwsh
        run: |
          Get-ChildItem obj-komorebi\dist -File | Select-Object Name, Length
          $zip = Get-ChildItem obj-komorebi\dist\komorebi-*.win64.zip | Where-Object { $_.Name -notmatch 'xpt_artifacts|symbols|tests|mozinfo' } | Select-Object -First 1
          if (-not $zip) { throw "package zip not found" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $hasExe = $z.Entries | Where-Object { $_.Name -eq 'komorebi.exe' }
          $z.Dispose()
          if (-not $hasExe) { throw "$($zip.Name) does not contain komorebi.exe" }
          Write-Host "Using $($zip.Name)"
          Copy-Item $zip.FullName Komorebi-Browser-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Komorebi-Browser-zip
          path: Komorebi-Browser-win64.zip
          compression-level: 0

  installer:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Komorebi-Browser-zip
          run-id: ${{ inputs.build_run_id != '' && inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive Komorebi-Browser-win64.zip -DestinationPath stage
          Get-ChildItem stage | Select-Object -First 20 Name

      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: browser/branding/komorebi

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          Test-Path "C:\Program Files (x86)\NSIS\makensis.exe"

      - name: Build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          @'
          Unicode true
          !ifndef APP_VERSION
            !define APP_VERSION "0.0.0"
          !endif
          !include "LogicLib.nsh"
          !include "FileFunc.nsh"
          !insertmacro GetParameters
          !insertmacro GetOptions

          Name "Komorebi Browser"
          Icon "src\browser\branding\komorebi\firefox.ico"
          UninstallIcon "src\browser\branding\komorebi\firefox.ico"
          OutFile "Komorebi-Browser-Setup.exe"
          InstallDir "$LOCALAPPDATA\Komorebi Browser"
          ; An earlier install keeps its folder, so a reinstall lands on it.
          InstallDirRegKey HKCU "Software\KomorebiBrowser" "InstallLocation"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles

          ; Set by the browser's own updater: Komorebi-Browser-Setup.exe /S /UPDATE /D=<install folder>
          Var UpdateMode

          Function .onInit
            StrCpy $UpdateMode 0
            ${GetParameters} $R0
            ClearErrors
            ${GetOptions} $R0 "/UPDATE" $R1
            ${IfNot} ${Errors}
              StrCpy $UpdateMode 1
            ${EndIf}
          FunctionEnd

          ; The updater starts this installer before the browser has finished
          ; closing. A running executable cannot be opened for writing, which
          ; tells this install apart from any other Firefox on the machine.
          ; Versions before 0.2.1 ran firefox.exe from the same folder.
          Function WaitForBrowserExit
            StrCpy $R2 "$INSTDIR\komorebi.exe"
            ${IfNot} ${FileExists} $R2
              StrCpy $R2 "$INSTDIR\firefox.exe"
            ${EndIf}
            StrCpy $R0 0
            ${Do}
              ${IfNot} ${FileExists} $R2
                ${Break}
              ${EndIf}
              ClearErrors
              FileOpen $R1 $R2 a
              ${IfNot} ${Errors}
                FileClose $R1
                ${Break}
              ${EndIf}
              IntOp $R0 $R0 + 1
              ${If} $R0 > 600
                SetErrorLevel 3
                Quit
              ${EndIf}
              Sleep 500
            ${Loop}
          FunctionEnd

          ; Moves the app's own browser folder aside instead of deleting it, so
          ; a locked file leaves the install untouched. Nothing else in the
          ; install folder is removed: it may be a folder the user shares.
          Function MoveBrowserFolderAside
            ${IfNot} ${FileExists} "$INSTDIR\komorebi.exe"
            ${AndIfNot} ${FileExists} "$INSTDIR\firefox.exe"
              Return
            ${EndIf}
            ${IfNot} ${FileExists} "$INSTDIR\browser\omni.ja"
              Return
            ${EndIf}
            RMDir /r "$INSTDIR\browser.old"
            StrCpy $R0 0
            ${Do}
              ClearErrors
              Rename "$INSTDIR\browser" "$INSTDIR\browser.old"
              ${IfNot} ${Errors}
                ${Break}
              ${EndIf}
              IntOp $R0 $R0 + 1
              ${If} $R0 > 40
                SetErrorLevel 4
                Quit
              ${EndIf}
              Sleep 500
            ${Loop}
          FunctionEnd

          Section "Install"
            ${If} $UpdateMode == 1
              Call WaitForBrowserExit
              Call MoveBrowserFolderAside
            ${EndIf}
            SetOutPath "$INSTDIR"
            File /r "ROOTDIR\*.*"
            ${If} $UpdateMode == 1
              RMDir /r "$INSTDIR\browser.old"
            ${EndIf}
            ; Only a folder an earlier Komorebi was installed to, never a real Firefox.
            ReadRegStr $R3 HKCU "Software\KomorebiBrowser" "InstallLocation"
            ${If} ${FileExists} "$INSTDIR\firefox.exe"
            ${AndIf} $R3 == $INSTDIR
              Delete "$INSTDIR\firefox.exe"
              ${If} ${FileExists} "$DESKTOP\Komorebi Browser.lnk"
                CreateShortcut "$DESKTOP\Komorebi Browser.lnk" "$INSTDIR\komorebi.exe"
              ${EndIf}
              ${If} ${FileExists} "$SMPROGRAMS\Komorebi Browser\Komorebi Browser.lnk"
                CreateShortcut "$SMPROGRAMS\Komorebi Browser\Komorebi Browser.lnk" "$INSTDIR\komorebi.exe"
              ${EndIf}
            ${EndIf}
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            ${If} $UpdateMode != 1
              CreateShortcut "$DESKTOP\Komorebi Browser.lnk" "$INSTDIR\komorebi.exe"
              CreateDirectory "$SMPROGRAMS\Komorebi Browser"
              CreateShortcut "$SMPROGRAMS\Komorebi Browser\Komorebi Browser.lnk" "$INSTDIR\komorebi.exe"
            ${EndIf}
            WriteRegStr HKCU "Software\KomorebiBrowser" "InstallLocation" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser" "DisplayName" "Komorebi Browser"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser" "DisplayVersion" "${APP_VERSION}"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser" "DisplayIcon" "$INSTDIR\komorebi.exe,0"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser" "InstallLocation" "$INSTDIR"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser" "UninstallString" "$INSTDIR\Uninstall.exe"
            ${If} $UpdateMode == 1
              Exec '"$INSTDIR\komorebi.exe"'
            ${EndIf}
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Komorebi Browser.lnk"
            RMDir /r "$SMPROGRAMS\Komorebi Browser"
            ; Only what the installer put there. The folder may be shared, so
            ; it is removed only once it is empty.
            !include "uninstall-files.nsh"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\KomorebiBrowser"
            DeleteRegKey HKCU "Software\KomorebiBrowser"
          SectionEnd
          '@ | Set-Content -Encoding utf8 installer.nsi
          $root = (Get-ChildItem stage -Recurse -Filter komorebi.exe | Select-Object -First 1).DirectoryName
          if (-not $root) { throw "komorebi.exe not found in package" }
          Write-Host "Package root: $root"
          (Get-Content installer.nsi -Raw).Replace('ROOTDIR', $root) | Set-Content -Encoding utf8 installer.nsi
          # What the uninstaller removes: the package's own top-level files and folders.
          $escape = { param($name) $name.Replace('$', '$$') }
          $lines = @()
          $lines += Get-ChildItem $root -File | ForEach-Object { '            Delete "$INSTDIR\' + (& $escape $_.Name) + '"' }
          $lines += Get-ChildItem $root -Directory | ForEach-Object { '            RMDir /r "$INSTDIR\' + (& $escape $_.Name) + '"' }
          $lines | Set-Content -Encoding utf8 uninstall-files.nsh
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if (-not $version) { $version = "0.0.0" }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPP_VERSION=$version" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item Komorebi-Browser-Setup.exe | Select-Object Name, Length
          (Get-FileHash Komorebi-Browser-Setup.exe -Algorithm SHA256).Hash.ToLower()

      - uses: actions/upload-artifact@v4
        with:
          name: Komorebi-Browser-Setup
          path: Komorebi-Browser-Setup.exe
          compression-level: 0

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Unversioned builds are prereleases so they never count as the
          # "latest" release the in-browser updater looks at.
          $flags = @()
          if ($env:RELEASE_VERSION) {
            $tag = $env:RELEASE_VERSION
            $title = "Komorebi Browser $tag (Windows x64)"
          } else {
            $tag = "windows-build-$env:GITHUB_RUN_NUMBER"
            $title = "Komorebi Browser (Windows x64) #$env:GITHUB_RUN_NUMBER"
            $flags += "--prerelease"
          }
          gh release create $tag Komorebi-Browser-Setup.exe --repo $env:GITHUB_REPOSITORY --title $title --notes "Download and run Komorebi-Browser-Setup.exe." --target $env:GITHUB_SHA @flags
